<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5">
        <animate attributeName="stop-color" values="#4f46e5; #7c3aed; #2563eb; #4f46e5" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899; #db2777; #9333ea; #ec4899" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="200" rx="20" fill="url(#bg-grad)" />
  
  <g stroke="rgba(255,255,255,0.1)" stroke-width="2">
    <path d="M 0 100 Q 200 50 400 100 T 800 100" fill="none">
      <animate attributeName="d" values="M 0 100 Q 200 50 400 100 T 800 100; M 0 100 Q 200 150 400 100 T 800 100; M 0 100 Q 200 50 400 100 T 800 100" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M 0 120 Q 200 170 400 120 T 800 120" fill="none">
      <animate attributeName="d" values="M 0 120 Q 200 170 400 120 T 800 120; M 0 120 Q 200 70 400 120 T 800 120; M 0 120 Q 200 170 400 120 T 800 120" dur="6s" repeatCount="indefinite" />
    </path>
  </g>

  <text x="50%" y="45%" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">
    Awesome Web3 API Platform
  </text>
  
  <text x="50%" y="70%" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#fbcfe8" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">
    Curated List of SaaS Products &amp; Open-Source Projects
  </text>

  <g transform="translate(60, 160)">
    <circle cx="0" cy="0" r="4" fill="#67e8f9">
      <animate attributeName="r" values="4; 6; 4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="20" cy="0" r="4" fill="#67e8f9">
      <animate attributeName="r" values="4; 6; 4" dur="2s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="40" cy="0" r="4" fill="#67e8f9">
      <animate attributeName="r" values="4; 6; 4" dur="2s" begin="1s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
